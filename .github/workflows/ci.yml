name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from `packageManager` in package.json — passing it here
      # too makes action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

      # A property of the published file, not of the source, so nothing above
      # can see it. Every module in react, ui and next declares "use client" and
      # none of those survive bundling, so without the build step that puts it
      # back, any server component importing from them throws at module
      # evaluation. That shipped in every version up to 0.12.1.
      - name: Verify client bundles declare "use client"
        run: node scripts/client-directive.mjs check

      # `pnpm typecheck` and `pnpm build` filter to ./packages/**, so the docs
      # site was never checked here at all — Vercel was the only thing that
      # would notice a broken page, and only after merge.
      - name: Typecheck and build the site
        run: |
          pnpm --filter @cairnkit/web exec tsc --noEmit
          pnpm --filter @cairnkit/web build
      - run: pnpm test
      # Dogfooding: the example app and the site are real consumers, so the
      # drift check that protects our users protects us first.
      - run: node packages/cli/dist/bin.js check examples/react-vite/src apps/web

      # The published size claims are load-bearing marketing. Fail if the
      # landing page and the built output disagree.
      - name: Verify advertised sizes
        run: node scripts/measure-size.mjs --check

      # sandboxes/ is generated from examples/. Nothing installs it in CI, so
      # a stale copy would rot silently and the public StackBlitz links would
      # drift from the code they claim to show.
      #
      # Skipped twice over, because a release moves through two events and the
      # check cannot pass in either:
      #
      #   the PR     `head_ref` is the release branch. It has already bumped
      #              the workspace to a version npm has never seen, and the
      #              generator refuses to pin one.
      #
      #   the merge  a push, where `head_ref` is empty — so the first condition
      #              alone never fired here. That is exactly how this failed on
      #              main after 0.8.0 and again after 0.9.0, both fixed by hand.
      #              release.yml regenerates the sandboxes after publishing,
      #              but it runs *concurrently* with this job, so no ordering
      #              saves it and the second condition is what does.
      #
      # Nothing is lost by skipping: only version numbers changed, no human
      # touched an example, and the repin lands moments later.
      - name: Verify sandboxes match their examples
        if: >-
          github.head_ref != 'changeset-release/main' &&
          !contains(github.event.head_commit.message, 'changeset-release/main')
        run: pnpm sandboxes:check

      # Scoped to the dependency closure we actually publish. A root-level
      # audit also walks the examples and the docs site, so an advisory in the
      # example's router blocks a release it cannot possibly affect — and a
      # gate that cries wolf is one people stop reading.
      - name: Audit published dependencies
        run: pnpm audit:published

      # The third drift check, and the only one that needs a browser.
      # TypeScript catches a typo, `cairn check` catches a deleted element,
      # and this catches an anchor that exists in source but never renders.
      #
      # Two projects share this browser: `example` audits the tours, and `docs`
      # asserts no page on the site scrolls sideways at 390px. The site had no
      # layout gate and shipped a 14px overflow that clipped the theme toggle
      # off the edge of every page, which is the same bug cloud had already
      # grown a gate for.
      - name: Install Playwright browser
        run: pnpm --filter @cairnkit/example-react-vite exec playwright install --with-deps chromium

      - name: Audit tours and site layout in a real browser
        run: pnpm --filter @cairnkit/example-react-vite exec playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: examples/react-vite/playwright-report/
          retention-days: 7
